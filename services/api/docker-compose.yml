services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ping_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: ping_residential
    ports:
      - "5432:5432"
    secrets:
      - postgres-password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

secrets:
  postgres-password:
    file: ./secrets/postgres-password
