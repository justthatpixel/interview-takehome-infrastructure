{{- if .Values.ingress.retry.enabled }}
# Buffering can replay an interrupted GET after upstream request headers were sent.
# IsNetworkError matches 502/504 and leaves overload 503 responses unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-retry
  labels:
    {{- include "proxy-api.labels" . | nindent 4 }}
spec:
  buffering:
    retryExpression: "IsNetworkError() && Attempts() < {{ .Values.ingress.retry.attempts }}"
{{- end }}
