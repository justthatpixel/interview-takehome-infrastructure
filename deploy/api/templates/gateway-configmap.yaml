{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "proxy-api.gatewayLabels" . | nindent 4 }}
data:
  envoy.yaml: |
    # Probes (/ready) and Prometheus (/stats/prometheus) use this port. It is
    # reachable inside the cluster only: Traefik routes to 8080, never here.
    admin:
      address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }

    static_resources:
      listeners:
        - name: http
          address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    route_config:
                      virtual_hosts:
                        - name: proxy_api
                          domains: ["*"]
                          routes:
                            # Only GET /proxy is retried: it only reads, so
                            # sending it twice is safe.
                            - match:
                                path: /proxy
                                headers:
                                  - name: ":method"
                                    string_match: { exact: GET }
                              route:
                                cluster: proxy_api
                                timeout: 15s
                                retry_policy:
                                  # Connection failures only: the pod died or
                                  # refused the connection. Never on 5xx: the
                                  # API answers 503 when full, and retrying
                                  # that would hide overload and add to it.
                                  retry_on: reset,connect-failure,refused-stream
                                  num_retries: 2
                                  # A request takes up to 3 s.
                                  per_try_timeout: 5s
                                  # Send the retry to a different pod than the
                                  # one that just failed.
                                  retry_host_predicate:
                                    - name: envoy.retry_host_predicates.previous_hosts
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                                  host_selection_retry_max_attempts: 5
                            # Anything else Traefik sends here is passed on
                            # without retries.
                            - match: { prefix: / }
                              route: { cluster: proxy_api, timeout: 15s }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: proxy_api
          # Resolves the headless Service, which returns one address per
          # Ready API pod. Re-resolved every second, so new pods get traffic
          # quickly and stopped pods drop out.
          type: STRICT_DNS
          dns_refresh_rate: 1s
          dns_lookup_family: V4_ONLY
          connect_timeout: 1s
          # Sends each request to the pod with the fewest in flight. A pod
          # refuses its 21st, so this spreads load better than round-robin,
          # especially onto pods that just started.
          lb_policy: LEAST_REQUEST
          circuit_breakers:
            thresholds:
              # Envoy allows only 3 retries at once for the whole cluster by
              # default. A killed pod can drop up to 20 requests together, so
              # most of their retries would be refused. A budget scales with
              # traffic (20% of requests in flight may be retries) instead of
              # a fixed number, so a failing cluster cannot double its own
              # load. The floor of 25 covers one full pod (20) dying at low
              # traffic.
              - retry_budget:
                  budget_percent: { value: 20 }
                  min_retry_concurrency: 25
          outlier_detection:
            # Take a pod out after one connection failure (it is dead), never
            # for the API's own 503s (it is busy). Ejecting busy pods under
            # load would push their load onto the rest and spread the overload.
            split_external_local_origin_errors: true
            consecutive_local_origin_failure: 1
            enforcing_consecutive_local_origin_failure: 100
            enforcing_consecutive_5xx: 0
            enforcing_consecutive_gateway_failure: 0
            enforcing_success_rate: 0
            enforcing_local_origin_success_rate: 0
            interval: 1s
            base_ejection_time: 5s
            # Never eject more than half the pods, whatever happens.
            max_ejection_percent: 50
          load_assignment:
            cluster_name: proxy_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Release.Name }}-headless.{{ .Release.Namespace }}.svc.cluster.local
                          port_value: 8080
{{- end }}
