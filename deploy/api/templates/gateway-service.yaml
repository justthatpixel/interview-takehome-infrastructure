{{- if .Values.gateway.enabled }}
# What Traefik routes to when the gateway is on.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "proxy-api.gatewayLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "proxy-api.gatewaySelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Lets Envoy see each API pod. A normal Service gives one virtual IP, and
# Envoy could not tell pods apart to retry on a different one. A headless
# Service returns one DNS record per Ready pod (publishNotReadyAddresses
# stays false, so starting and stopping pods are left out).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  labels:
    {{- include "proxy-api.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "proxy-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
