apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "proxy-api.labels" . | nindent 4 }}
  {{- if .Values.ingress.retry.enabled }}
  annotations:
    # Traefik names CRD middlewares <namespace>-<name>@kubernetescrd.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-retry@kubernetescrd
  {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Only the public route. Health and metrics on 9090 stay inside the cluster.
          - path: /proxy
            pathType: Exact
            backend:
              service:
                # Through the Envoy gateway when it is on, else straight to the API.
                name: {{ .Release.Name }}{{ if .Values.gateway.enabled }}-gateway{{ end }}
                port:
                  name: http
