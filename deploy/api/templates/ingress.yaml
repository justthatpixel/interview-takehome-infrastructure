apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "proxy-api.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Only the public route. Health and metrics on 9090 stay inside the cluster.
          - path: /proxy
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
