{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "proxy-api.gatewayLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "proxy-api.gatewaySelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Same as the API: never lose capacity during a deploy.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "proxy-api.gatewayLabels" . | nindent 8 }}
      annotations:
        # Envoy reads its config only at start, so roll the pods when it changes.
        checksum/config: {{ include (print $.Template.BasePath "/gateway-configmap.yaml") . | sha256sum }}
        # Retry and upstream metrics, for dashboards and alerts.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9902"
        prometheus.io/path: /stats/prometheus
        # Only stats Envoy has actually updated. The full set is about 900
        # series per pod, mostly for features this config does not use.
        prometheus.io/param_usedonly: "true"
    spec:
      # Covers the preStop sleep, plus a buffer for Envoy to exit.
      terminationGracePeriodSeconds: {{ add .Values.gateway.preStopSleepSeconds 10 }}
      # One pod per zone, as for the API. See deployment.yaml.
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "proxy-api.gatewaySelectorLabels" . | nindent 14 }}
      containers:
        - name: envoy
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          # Two worker threads. By default Envoy starts one per CPU it sees
          # (12 here), which costs memory and buys nothing at this load.
          args: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "2"]
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 9902
          lifecycle:
            # Envoy exits at once on SIGTERM. Keep it serving until Traefik
            # has dropped the pod and the requests it already has are done.
            preStop:
              sleep:
                seconds: {{ .Values.gateway.preStopSleepSeconds }}
          # /healthz is answered by the health_check filter on the ops listener.
          readinessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-gateway
{{- end }}
