# Shared defaults. Environment files set the ingress host and database user.
image:
  repository: localhost:5001/proxy-api
  tag: dev

autoscaling:
  # Two per zone at baseline, with headroom for crashes and scale-up delay.
  # Four replicas failed an earlier fresh-cluster load ramp.
  minReplicas: 6
  # The latest 60 req/s tests peaked at 12-13; 20 leaves scaling headroom.
  # Database connection limits remain a separate constraint; see README.
  maxReplicas: 20
  # Each pod rejects its 21st request. Aim below that limit because new pods
  # take 20-30 s to become useful. Passed both environments with Buffering.
  targetInFlight: 8
  prometheusAddress: http://prometheus-server.monitoring.svc

ingress:
  host: development.localhost
  retry:
    enabled: true
    # Total attempts, including the first. Buffering replays 502/504 responses
    # from interrupted requests, while passing overload 503s through.
    attempts: 3

api:
  logLevel: info
  # Time allowed for active requests to finish after SIGTERM.
  shutdownTimeoutSeconds: 10
  # Keep serving while Traefik learns that the pod is terminating. The 15 s
  # margin is retained from the tested chart; observed propagation was 1.8 s.
  preStopSleepSeconds: 15

postgres:
  host: postgres.db.svc.cluster.local
  port: 5432
  user: api_development
  database: ping_residential
  # local/setup.sh copies this Secret into each release namespace.
  passwordSecret: postgres-password

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  # Bound memory use. No CPU limit: this workload mostly waits, and CPU
  # throttling would add latency.
  limits:
    memory: 128Mi
