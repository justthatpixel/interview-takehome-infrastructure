# Shared defaults. development.yaml and production.yaml set what differs per
# namespace.

image:
  repository: localhost:5001/proxy-api
  tag: dev

autoscaling:
  # Two per zone. At the 14 req/s baseline about 22 requests are in flight,
  # which the target below already turns into 5 pods. With 3, a pod killed
  # before the autoscaler caught up left 2 pods holding ~32 requests plus the
  # gateway's retries, and one hit the 20 limit (503 x 4 in level 4). With 6,
  # losing a pod or a whole zone still leaves 4.
  minReplicas: 6
  # Enough for 60 req/s (about 96 in flight) at the target below. Each pod's
  # DB pool can open up to max(4, CPUs) connections (12 on these nodes), and
  # Postgres allows 100 for both environments. The API holds a connection
  # only for one short query, so a pod really uses one or two, but the cap
  # keeps the worst case bounded.
  maxReplicas: 20
  # Average requests in flight per pod to aim for. A pod refuses the 21st
  # (503). A scale-up takes 20-30 s to land (scrape, HPA sync, pod start),
  # and new pods get less traffic at first, so the busiest pod runs well
  # above the average. At 8, a 60 s ramp pushed a pod to 20 while the
  # average was 12. 5 leaves room for both.
  targetInFlight: 5
  # Where KEDA reads the metric. Installed by local/setup.sh.
  prometheusAddress: http://prometheus-server.monitoring.svc

ingress:
  host: development.localhost
  # Retry requests that Traefik could not deliver (connection refused). With
  # the gateway on, this covers a gateway pod dying. See templates/retry.yaml.
  retry:
    enabled: true
    attempts: 3
    initialInterval: 50ms

api:
  logLevel: info
  # How long the API drains in-flight requests after SIGTERM. A request takes
  # at most 3 s, so 10 s is plenty.
  shutdownTimeoutSeconds: 10
  # How long the pod keeps serving after Kubernetes starts to stop it, before
  # the API gets SIGTERM. Whatever routes to the pod must drop it in this time,
  # or it sends requests to a closed port (502). Traefik takes about 2 s. The
  # gateway finds pods by DNS, which can lag by up to about 6 s (1 s refresh
  # plus the 5 s record TTL), so 15 s leaves a wide margin.
  preStopSleepSeconds: 15

# Envoy between Traefik and the API pods. When an API pod dies with requests
# in flight (SIGKILL, OOM, crash), Envoy sends those GET /proxy requests again
# to another pod. Traefik 2.11 cannot: it never resends a request it has
# already written. Off sends Traefik straight to the API, as for levels 1-3.
gateway:
  enabled: true
  image:
    repository: envoyproxy/envoy
    tag: v1.34.1
  # One per zone. A fixed count: Envoy only forwards, so 3 pods carry far
  # more than the API's 20 pods can take.
  replicas: 3
  # Envoy exits at once on SIGTERM, so this sleep is its drain. Longer than
  # the 15 s route timeout, so a request that arrived just before Traefik
  # dropped the pod still finishes.
  preStopSleepSeconds: 20
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    # No CPU limit, for the same reason as the API.
    limits:
      memory: 128Mi

postgres:
  host: postgres.db.svc.cluster.local
  port: 5432
  user: api_development
  database: ping_residential
  # Secret in the release namespace with the DB password in key "password".
  # local/setup.sh copies it from the db namespace.
  passwordSecret: postgres-password

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  # Memory limit to stop a leak from hurting the node. No CPU limit: throttling
  # would only add latency, and the API's work is mostly waiting.
  limits:
    memory: 128Mi
